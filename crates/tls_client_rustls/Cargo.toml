[package]
name = "tls_client_rustls"
version = "0.0.0"
edition = "2024"

[dependencies]

# HTTP client TLS
fcm = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
tokio-tungstenite = { workspace = true }
async-openai = { workspace = true }

[features]
enable = [
    "fcm/rustls",
    "reqwest/rustls",
    "lettre/tokio1-rustls",
    "lettre/aws-lc-rs",
    "lettre/rustls-platform-verifier",
    "tokio-tungstenite/rustls-tls-native-roots",
    "async-openai/rustls",
]
