[workspace]
resolver = "3"
members = [
    # Binary crates
    "crates/afrodite-backend",
    # Library crates
    "crates/api_client",
    "crates/model",
    "crates/model_server_data",
    "crates/model_server_state",
    "crates/model_chat",
    "crates/model_profile",
    "crates/model_media",
    "crates/model_account",
    "crates/config",
    "crates/utils",
    "crates/test_mode",
    "crates/test_mode_bot",
    "crates/test_mode_bot_runner",
    "crates/test_mode_test_macro",
    "crates/test_mode_test_utils",
    "crates/test_mode_test_runner",
    "crates/test_mode_tests",
    "crates/test_mode_tests_account",
    "crates/test_mode_tests_profile",
    "crates/test_mode_tests_media",
    "crates/test_mode_utils",
    "crates/database",
    "crates/database_chat",
    "crates/database_profile",
    "crates/database_media",
    "crates/database_account",
    "crates/server",
    "crates/server_common",
    "crates/server_state",
    "crates/server_router_chat",
    "crates/server_router_profile",
    "crates/server_router_media",
    "crates/server_router_account",
    "crates/server_api",
    "crates/server_api_chat",
    "crates/server_api_profile",
    "crates/server_api_media",
    "crates/server_api_account",
    "crates/server_data",
    "crates/server_data_chat",
    "crates/server_data_profile",
    "crates/server_data_media",
    "crates/server_data_account",
    "crates/server_data_all",
    "crates/simple_backend",
    "crates/simple_backend_image_process",
    "crates/simple_backend_config",
    "crates/simple_backend_utils",
    "crates/simple_backend_database",
    "crates/simple_backend_model",
    "crates/simple_diesel_enum_macro",
    # Manager
    "crates/manager",
    "crates/manager_api",
    "crates/manager_config",
    "crates/manager_model",
]

[workspace.dependencies]

# Build dependencies
vergen-gitcl = { version = "10.0.2", features = ["build", "cargo", "rustc"] }

error-stack = "0.8.0"
thiserror = "2.0.19"

# rand 0.10 is available but pgp uses rand 0.8
rand = "0.8.7"
rand_xoshiro = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
base64 = "0.23.1"
base16ct = { version = "1.0.0", features = ["alloc"] }
nalgebra = "0.35.0"
num_cpus = "1.17.0"
nix = { version = "0.31.3", default-features = false, features = ["signal", "fs"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mozjpeg = "0.10.13"
bitflags = "2.13.1"
num_enum = "0.7.6"
sha1 = "0.11.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ipnet = "2.12.1"
maxminddb = "0.30.0"
zip = "8.6.0"
regex = "1.13.1"
aes-gcm = "0.10.3"
handlebars = "6.4.3"

clap = { version = "4.6.5", features = ["cargo", "derive"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# For tokio-console debugging. Disabled currently.
# If you want to enable this uncomment also .cargo
# console-subscriber = "0.4.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
toml = "1.1.4"
csv = "1.4.0"

diesel = { version = "2.3.11", features = ["postgres", "sqlite", "returning_clauses_for_sqlite_3_35", "chrono", "64-column-tables"] }
diesel_migrations = "2.3.2"
deadpool = { version = "0.13.0" }

futures = "0.3.33"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "fs"] }
tokio-util = { version = "0.7.19", features = ["io"]}
async-trait = "0.1.91"

reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls", "brotli", "gzip", "zstd"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = { version = "0.2.0" }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
url = { version = "2.5.8", features = ["serde"] }
http = "1.5.0"
headers = "0.4.1"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros", "http2"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace", "compression-br", "compression-gzip", "compression-zstd"] }

# Email sending
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }

# File hosting package extracting
flate2 = "1.1.9"
tar = "0.4.46"
mime = "0.3.17"

# Server TLS
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-rustls-acme = { version = "0.9.1", default-features = false }
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.0"

# Procedural macros
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"

# Test mode
inventory = "0.3.24"
tokio-tungstenite = { version = "0.29.0", features = ["url", "rustls-tls-native-roots"] }
pgp = { version = "0.20.0", default-features = false }
smallvec = "1.15.2"
async-openai = { version = "0.41.3", default-features = false, features = ["chat-completion", "rustls"] }
unicode-segmentation = "1.13.3"
icu_properties = "2.2.0"
nsfw = { version = "0.2.0", default-features = false }

# Firebase cloud messaging
[workspace.dependencies.fcm]
git = "https://github.com/jutuon/fcm-rust"
rev = "88c8b4c16908af5b77f84316ea5a913c6f2a5889"
default-features = false
features = ["rustls"]

# Face detection
[workspace.dependencies.rustface]
git = "https://github.com/jutuon/rustface"
rev = "73d4d116b9e0641fe42fed9df0cce5aaf52e56d5"

# APNs support
[workspace.dependencies.a2]
git = "https://github.com/jutuon/a2"
rev = "f9cf21653eed774104c961c878519d52d2785f75"
default-features = false
features = ["aws-lc-rs"]

[workspace.dependencies.web-push]
git = "https://github.com/jutuon/rust-web-push"
rev = "961f307d53009cba9c036f650c57339c72842530"
default-features = false
features = ["hyper-rustls-client"]

# Make image processing faster for debug builds
[profile.dev.package.image]
opt-level = 3

# Improve build time
[profile.dev]
debug = 0
strip = "debuginfo"
